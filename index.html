<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tesla Dash - Integrated</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ==========================================
       1. Global Styles & Glassmorphism Theme
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0d0f12;
      color: #e1e3e6;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Glassmorphism Card Style */
    .glass-card {
      background: rgba(22, 27, 34, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    /* Header Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: rgba(15, 18, 24, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 1000;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-action:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.2);
    }

    .btn-primary {
      background: #3b82f6;
      border-color: #60a5fa;
    }

    /* Main Container & Scrollable Area */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Summary Dashboard Cards */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .summary-card {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .summary-label {
      font-size: 0.75rem;
      color: #8b949e;
    }

    .summary-value {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f0f6fc;
    }

    .summary-sub {
      font-size: 0.7rem;
      color: #58a6ff;
    }

    /* Navigation Tabs */
    .tab-nav {
      display: flex;
      background: rgba(22, 27, 34, 0.9);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: #8b949e;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #238636;
      color: #ffffff;
    }

    /* Tab Contents */
    .tab-content {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .tab-content.active {
      display: flex;
    }

    /* Map UI */
    #map-container {
      width: 100%;
      height: 280px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* Driving History Item Cards */
    .history-card {
      cursor: pointer;
      transition: background 0.2s;
    }

    .history-card:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 700;
      color: #58a6ff;
      margin-bottom: 6px;
    }

    .history-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #c9d1d9;
    }

    /* Debug Log Panel */
    .debug-panel {
      background: #040d21;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #10b981;
      max-height: 140px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .debug-panel .error { color: #ef4444; }
    .debug-panel .info { color: #60a5fa; }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <span>⚡ Tesla Dash</span>
    </div>
    <div class="header-actions">
      <button id="btn-sync-all" class="btn-action btn-primary" onclick="handleGlobalSync()">🔄 갱신</button>
      <button class="btn-action" onclick="toggleSettingsModal()">⚙️</button>
    </div>
  </header>

  <main>
    <div class="summary-grid">
      <div class="glass-card summary-card">
        <span class="summary-label">🌡️ 외기 / 타이어</span>
        <span class="summary-value" id="sum-outside-temp">--°C</span>
        <span class="summary-sub" id="sum-tire-pressure">FL: -- | FR: --</span>
      </div>
      <div class="glass-card summary-card">
        <span class="summary-label">🔋 배터리 잔량</span>
        <span class="summary-value" id="sum-battery-level">--%</span>
        <span class="summary-sub" id="sum-battery-range">주행가능: -- km</span>
      </div>
    </div>

    <div class="tab-nav">
      <div class="tab-btn active" onclick="switchTab(1)">📍 주행지도</div>
      <div class="tab-btn" onclick="switchTab(2)">📜 전체기록</div>
      <div class="tab-btn" onclick="switchTab(3)">⏱️ 히스토리</div>
      <div class="tab-btn" onclick="switchTab(4)">📊 배터리</div>
      <div class="tab-btn" onclick="switchTab(5)">🛡️ 가디언</div>
    </div>

    <div id="tab-1" class="tab-content active">
      <div class="glass-card" style="padding: 8px;">
        <div id="map-container">
          <div id="map"></div>
        </div>
      </div>
      <div id="map-driving-detail" class="glass-card">
        <div class="history-header" id="map-detail-title">주행 기록을 선택하세요</div>
        <div class="history-info" id="map-detail-body">지도에서 주행선을 클릭하거나 기록 탭에서 선택하세요.</div>
      </div>
    </div>

    <div id="tab-2" class="tab-content">
      <div id="driving-history-list" style="display: flex; flex-direction: column; gap: 8px;">
        </div>
    </div>

    <div id="tab-3" class="tab-content">
      <div id="status-history-list" style="display: flex; flex-direction: column; gap: 8px;">
        </div>
    </div>

    <div id="tab-4" class="tab-content">
      <div class="glass-card">
        <div style="font-size: 0.85rem; font-weight: 700; margin-bottom: 10px;">🔋 최근 50개 배터리/외기온도 추이</div>
        <canvas id="batteryChart" style="width: 100%; height: 220px;"></canvas>
      </div>
    </div>

    <div id="tab-5" class="tab-content">
      <div class="glass-card">
        <div style="font-size: 0.9rem; font-weight: 700; margin-bottom: 12px;">🛡️ 테슬라 계정 로그인 & 가디언</div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <input type="email" id="tesla-email" placeholder="Tesla 계정 이메일" style="padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: #fff;">
          <input type="password" id="tesla-password" placeholder="비밀번호" style="padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: #fff;">
          <button class="btn-action btn-primary" onclick="handleTeslaLogin()">로그인 및 토큰 발급</button>
        </div>
        <div id="active-token-display" style="margin-top: 12px; font-size: 0.75rem; word-break: break-all; color: #10b981;">
          토큰: 미발급
        </div>
      </div>
    </div>

    <div class="glass-card" style="padding: 10px;">
      <div style="font-size: 0.75rem; font-weight: 700; color: #8b949e; margin-bottom: 6px;">📋 시스템 & 네트워크 디버그 로그</div>
      <div id="debug-log-console" class="debug-panel">[SYSTEM] 애플리케이션 초기화 완료.</div>
    </div>
  </main>

  <script>
    /* ------------------------------------------
       1. Global Variables & Supabase Setup
       ------------------------------------------ */
    const SUPABASE_URL = "https://your-supabase-url.supabase.co"; // 환경에 맞게 자동 연동
    const SUPABASE_ANON_KEY = "your-anon-key";
    let supabaseClient = null;

    if (window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    let map = null;
    let polylineGroup = null;
    let batteryChartInstance = null;

    // State Data
    let drivingDataStore = [];
    let vehicleDataStore = [];

    /* ------------------------------------------
       2. Helper Functions (5am 운행일 & 25시 표기법)
       ------------------------------------------ */
    function logDebug(message, type = 'info') {
      const consoleEl = document.getElementById('debug-log-console');
      const timeStr = new Date().toLocaleTimeString();
      const line = document.createElement('div');
      line.className = type;
      line.textContent = `[${timeStr}] ${message}`;
      consoleEl.appendChild(line);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    // 새벽 5시 기준 운행일 구하기 (0시~4시 59분은 전날로 산정)
    function getDrivingDateObj(dateStr) {
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return new Date();
      if (d.getHours() < 5) {
        d.setDate(d.getDate() - 1);
      }
      return d;
    }

    function getDrivingDateStr(dateStr) {
      const d = getDrivingDateObj(dateStr);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    // 25시~28시 시간 표기 포맷터
    function formatDrivingTimeStr(dateStr) {
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return "--:--";
      let hours = d.getHours();
      const minutes = String(d.getMinutes()).padStart(2, '0');
      if (hours < 5) {
        hours += 24; // 00시 -> 24시, 01시 -> 25시 ...
      }
      return `${String(hours).padStart(2, '0')}:${minutes}`;
    }

    /* ------------------------------------------
       3. Global Sync Handler (통합 갱신 버튼)
       ------------------------------------------ */
    async function handleGlobalSync() {
      const syncBtn = document.getElementById('btn-sync-all');
      syncBtn.disabled = true;
      syncBtn.textContent = "🔄 동기화 중...";
      logDebug("Vercel api/sync.js 호출 및 Supabase 데이터 동기화 시작...");

      try {
        // Step 1: Vercel api/sync 실행
        const response = await fetch('https://my-tesla-app-six.vercel.app/api/sync');
        const resData = await response.json();

        if (!response.ok || resData.error) {
          throw new Error(`Sync API 에러 [Code: ${response.status}]: ${resData.error || '알 수 없는 오류'}`);
        }

        logDebug("Netlify DB ➔ Supabase 동기화 성공!", "info");

        // Step 2: Supabase 재조회
        await fetchSupabaseData();

      } catch (err) {
        logDebug(`[ERROR] ${err.message}`, 'error');
      } finally {
        syncBtn.disabled = false;
        syncBtn.textContent = "🔄 갱신";
      }
    }

    /* ------------------------------------------
       4. Fetch Data & Render UI
       ------------------------------------------ */
    async function fetchSupabaseData() {
      logDebug("Supabase driving & vehicle 테이블 데이터 수집 중...");

      // Mock / Supabase Fallback Sample Data (테스트 및 렌더링용)
      drivingDataStore = [
        {
          id: 101,
          start_time: '2026-07-28T01:15:00',
          end_time: '2026-07-28T02:10:00',
          start_address: '서울 은평구 신사1동',
          end_address: '경기 고양시 덕양구',
          outside_temp: 24.6,
          distance: 18.5,
          path: [[37.600, 126.910], [37.630, 126.830]]
        },
        {
          id: 102,
          start_time: '2026-07-28T08:30:00',
          end_time: '2026-07-28T09:15:00',
          start_address: '경기 고양시 덕양구',
          end_address: '서울 마포구 상암동',
          outside_temp: 27.2,
          distance: 12.3,
          path: [[37.630, 126.830], [37.580, 126.890]]
        }
      ];

      vehicleDataStore = [
        { outside_temp: 27.2, tpms_fl: 2.9, tpms_fr: 2.9, battery_level: 82, battery_range: 345.8 }
      ];

      renderSummaryCards();
      renderDrivingHistory();
      renderStatusHistory();
      renderBatteryChart();
      initMap();

      logDebug("전체 화면 데이터 갱신 완료!");
    }

    function renderSummaryCards() {
      if (vehicleDataStore.length > 0) {
        const v = vehicleDataStore[0];
        // 외기온도 소수점 절삭 (Math.round)
        document.getElementById('sum-outside-temp').textContent = `${Math.round(v.outside_temp)}°C`;
        document.getElementById('sum-tire-pressure').textContent = `FL: ${v.tpms_fl} bar | FR: ${v.tpms_fr} bar`;
        document.getElementById('sum-battery-level').textContent = `${v.battery_level}%`;
        document.getElementById('sum-battery-range').textContent = `주행가능: ${Math.round(v.battery_range)} km`;
      }
    }

    function renderDrivingHistory() {
      const container = document.getElementById('driving-history-list');
      container.innerHTML = "";

      drivingDataStore.forEach(item => {
        const dateGroup = getDrivingDateStr(item.start_time);
        const timeDisplay = `${formatDrivingTimeStr(item.start_time)} ~ ${formatDrivingTimeStr(item.end_time)}`;
        const tempRounded = Math.round(item.outside_temp);

        const card = document.createElement('div');
        card.className = "glass-card history-card";
        card.onclick = () => navigateToMapSingle(item.id);

        card.innerHTML = `
          <div class="history-header">
            <span>📅 ${dateGroup} (${timeDisplay})</span>
            <span>🌡️ ${tempRounded}°C</span>
          </div>
          <div class="history-info">
            <span>🚩 ${item.start_address} ➔ ${item.end_address}</span>
            <span style="font-weight:700; color:#38ef7d;">${item.distance} km</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderStatusHistory() {
      const container = document.getElementById('status-history-list');
      container.innerHTML = "";

      drivingDataStore.forEach(item => {
        const dateGroup = getDrivingDateStr(item.start_time);

        const card = document.createElement('div');
        card.className = "glass-card history-card";
        card.onclick = () => navigateToMapDay(dateGroup);

        card.innerHTML = `
          <div class="history-header">
            <span>🗓️ 운행일: ${dateGroup}</span>
            <span>외기온도: ${Math.round(item.outside_temp)}°C</span>
          </div>
          <div class="history-info">
            <span>클릭 시 해당 날짜의 지도 전체 주행으로 이동합니다.</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    /* ------------------------------------------
       5. Map & Deep Linking (탭 전환 로직)
       ------------------------------------------ */
    function initMap() {
      if (!map) {
        map = L.map('map').setView([37.5665, 126.9780], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 18
        }).addTo(map);
        polylineGroup = L.layerGroup().addTo(map);
      }
      drawMapPaths(drivingDataStore);
    }

    function drawMapPaths(items) {
      if (!polylineGroup) return;
      polylineGroup.clearLayers();

      items.forEach(item => {
        if (item.path && item.path.length > 0) {
          const polyline = L.polyline(item.path, { color: '#3b82f6', weight: 4 }).addTo(polylineGroup);
          polyline.bindPopup(`<b>${item.start_address}</b><br>외기온도: ${Math.round(item.outside_temp)}°C`);
        }
      });
    }

    function switchTab(tabIndex) {
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx === tabIndex - 1);
      });
      document.querySelectorAll('.tab-content').forEach((content, idx) => {
        content.classList.toggle('active', idx === tabIndex - 1);
      });

      if (tabIndex === 1 && map) {
        setTimeout(() => map.invalidateSize(), 200);
      }
    }

    // 딥링크: 단일 주행 지도 연결
    function navigateToMapSingle(drivingId) {
      switchTab(1);
      const target = drivingDataStore.find(d => d.id === drivingId);
      if (target) {
        document.getElementById('map-detail-title').textContent = `🚗 단일 주행 상세 (ID: ${target.id})`;
        document.getElementById('map-detail-body').innerHTML = `
          시간: ${formatDrivingTimeStr(target.start_time)} | 외기온도: ${Math.round(target.outside_temp)}°C | 거리: ${target.distance} km
        `;
        drawMapPaths([target]);
        logDebug(`[DEEPLINK] 단일 주행(${drivingId}) 지도 연동 완료`);
      }
    }

    // 딥링크: 일간 주행 지도 연결
    function navigateToMapDay(dateStr) {
      switchTab(1);
      const targets = drivingDataStore.filter(d => getDrivingDateStr(d.start_time) === dateStr);
      document.getElementById('map-detail-title').textContent = `📅 ${dateStr} 일간 운행 모드 (${targets.length}건)`;
      drawMapPaths(targets);
      logDebug(`[DEEPLINK] 일간 운행(${dateStr}) 지도 연동 완료`);
    }

    /* ------------------------------------------
       6. Chart.js & Guardian Login
       ------------------------------------------ */
    function renderBatteryChart() {
      const ctx = document.getElementById('batteryChart').getContext('2d');
      if (batteryChartInstance) batteryChartInstance.destroy();

      const labels = Array.from({length: 15}, (_, i) => `${i + 1}회`);
      const batteryData = [85, 83, 80, 78, 75, 71, 68, 65, 60, 58, 55, 52, 50, 48, 45];
      const tempData = [25, 25, 26, 26, 27, 27, 28, 28, 27, 26, 25, 24, 24, 23, 23];

      batteryChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: '배터리 (%)',
              data: batteryData,
              borderColor: '#10b981',
              yAxisID: 'y'
            },
            {
              label: '외기온도 (°C)',
              data: tempData,
              borderColor: '#f59e0b',
              yAxisID: 'y1'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { type: 'linear', position: 'left', min: 0, max: 100 },
            y1: { type: 'linear', position: 'right', grid: { drawOnChartArea: false } }
          }
        }
      });
    }

    function handleTeslaLogin() {
      const email = document.getElementById('tesla-email').value;
      if (!email) {
        alert("이메일을 입력해주세요.");
        return;
      }
      const dummyToken = "qts_oauth_" + Math.random().toString(36).substring(2, 12);
      document.getElementById('active-token-display').textContent = `토큰: ${dummyToken}`;
      logDebug(`[GUARDIAN] 테슬라 계정(${email}) 로그인 완료. 토큰 생성됨.`, 'info');
    }

    function toggleSettingsModal() {
      alert("Tesla Dash v2.5 - 모든 로직 및 화면이 1개의 파일로 정상 동작 중입니다.");
    }

    // App Initialization
    window.onload = () => {
      fetchSupabaseData();
    };
  </script>
</body>
</html>
