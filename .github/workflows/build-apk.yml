name: Build Android APK with Auto Icon

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python & Pillow
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate Android App Icons
        run: |
          python -c "
          import os
          from PIL import Image, ImageDraw

          candidates = [
              'app/src/main/assets/www/icon.png',
              'www/icon.png',
              'www/icon.jpg',
              'www/icon.jpeg',
              'www/icon.webp',
              'public/icon.png'
          ]

          icon_path = None
          for path in candidates:
              if os.path.exists(path):
                  icon_path = path
                  break

          img = None

          if icon_path:
              try:
                  print(f'🔍 아이콘 이미지 발견: {icon_path}')
                  raw_img = Image.open(icon_path).convert('RGBA')
                  w, h = raw_img.size
                  max_size = max(w, h)
                  square_img = Image.new('RGBA', (max_size, max_size), (0, 0, 0, 0))
                  offset = ((max_size - w) // 2, (max_size - h) // 2)
                  square_img.paste(raw_img, offset)
                  img = square_img
                  print(f'📐 원본({w}x{h}) -> 정사각형({max_size}x{max_size}) 캔버스 변환 완료')
              except Exception as e:
                  print(f'⚠️ 이미지 파일 처리 실패 ({e})')

          if img is None:
              print('🎨 기본 앱 아이콘을 자동으로 생성합니다.')
              img = Image.new('RGBA', (512, 512), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              draw.ellipse([32, 32, 480, 480], fill=(225, 6, 0, 255))

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          res_dir = 'app/src/main/res'

          for folder, size in sizes.items():
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)
              resized = img.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(os.path.join(target_dir, 'ic_launcher.png'))
              resized.save(os.path.join(target_dir, 'ic_launcher_round.png'))

          print('✅ 모든 해상도별 안드로이드 아이콘 변환 완료!')
          "

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10'  # 👈 8.10으로 업데이트

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean Build
        run: ./gradlew clean  # 👈 clean 추가

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeslaDash-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
