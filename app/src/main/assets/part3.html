  <script>
    const SECRET_SALT = "Tesla_Supabase_Dashboard_2026";
    let configObj = { 
      kakaoKey: '159c5d7588efc5939d431f005912f9f3', 
      url: '', 
      key: '', 
      ghToken: '', 
      vehicleId: '3744141651867089', 
      ntfyTopic: 'MJYAz6ZyjXiujaTDpJ' 
    };

    let supabaseClient = null;
    let currentMainTab = localStorage.getItem('tesla_main_tab') || 'monitor';
    let currentSubTab = localStorage.getItem('tesla_sub_tab') || 'vehicle';
    
    const VERCEL_BACKEND_URL = "https://my-tesla-app-six.vercel.app/api/exchange"; 
    const CLIENT_ID = "272ac00a-248e-4fa7-8027-1fc06e8e9a24";
    const REDIRECT_URI = "https://my-tesla-app-six.vercel.app/api/callback";
    let callbackHandled = false;

    let accessToken = localStorage.getItem('tesla_access_token') || "";
    let monitorTimer = null;
    let drivingSyncTimer = null;
    let lastSentryState = false;
    let isAppInForeground = true; 

    let map = null, geocoder = null;
    let allTrips = [], vehicleRows = [];

    // ──────────────────────────────────────────────────────────
    // [5am~익일 5am 운행일 기준 및 25시 포맷 Helper 함수들]
    // ──────────────────────────────────────────────────────────
    
    /**
     * 타임스탬프를 5am 차감하여 "운행일" 기준 Date 객체 생성
     */
    function getDrivingDateObj(dateInput) {
      if (!dateInput) return new Date();
      let isoStr = typeof dateInput === 'string' ? dateInput.replace(' ', 'T') : dateInput;
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return new Date();
      // 5시간(5 * 3600 * 1000 ms) 차감하여 운행일자 결정
      return new Date(d.getTime() - 5 * 60 * 60 * 1000);
    }

    /**
     * 5am 기준 운행일 날짜 문자열 (YYYY-MM-DD)
     */
    function getDrivingDateStr(dateInput) {
      const d = getDrivingDateObj(dateInput);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    /**
     * 5am 기준 시각 표시 문자열 (HH:mm)
     * 새벽 00:00 ~ 04:59 시간대는 24:00 ~ 28:59 로 표시 (예: 01:30 -> 25:30)
     */
    function formatDrivingTimeStr(dateInput) {
      if (!dateInput) return '-';
      let isoStr = typeof dateInput === 'string' ? dateInput.replace(' ', 'T') : dateInput;
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return '-';

      let hours = d.getHours();
      const minutes = String(d.getMinutes()).padStart(2, '0');

      if (hours < 5) {
        hours += 24;
      }

      const hourStr = String(hours).padStart(2, '0');
      return `${hourStr}:${minutes}`;
    }

    /**
     * 운행일 카드 헤더 표시 포맷 (예: 2026. 07. 27. (월))
     */
    function formatDrivingDayHeader(drivingDateStr) {
      if (!drivingDateStr) return '';
      const parts = drivingDateStr.split('-');
      if (parts.length < 3) return drivingDateStr;
      const year = parts[0];
      const month = parts[1];
      const day = parts[2];

      const d = new Date(parseInt(year), parseInt(month) - 1, parseInt(day));
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const dayOfWeek = days[d.getDay()] || '';

      return `${year}. ${month}. ${day}. (${dayOfWeek})`;
    }

    /**
     * driving_time 컬럼 분 단위 계산 Helper (ISO 포맷 안전 처리)
     */
    function parseDrivingTimeToMinutes(item) {
      if (!item) return 0;
      let val = item.driving_time ?? item.duration ?? item.duration_min ?? item.drive_time ?? item.driving_time_min;
      if (val !== undefined && val !== null && !isNaN(val)) {
        val = Number(val);
        if (val > 300) return Math.round(val / 60); // 초 단위인 경우 분으로 변환
        return Math.round(val);
      }
      if (item.start_time && item.end_time) {
        const s = new Date(String(item.start_time).replace(' ', 'T')).getTime();
        const e = new Date(String(item.end_time).replace(' ', 'T')).getTime();
        if (!isNaN(s) && !isNaN(e) && e > s) {
          return Math.round((e - s) / 60000);
        }
      }
      return 0;
    }

    function addLog(msg) {
      const logsEl = document.getElementById('guardianLogs');
      if (!logsEl) return;
      const time = new Date().toLocaleTimeString('ko-KR');
      const div = document.createElement('div');
      div.className = "py-0.5 border-b border-gray-800/50 text-[11px] font-mono leading-relaxed";
      div.textContent = `[${time}] ${msg}`;
      logsEl.prepend(div);
    }

    async function flashLights() {
      if (!accessToken) return;
      addLog('⚡ [자동] 비상등 점등 시도...');
      try {
        const res = await fetch(`https://fleet-api.prd.na.vn.cloud.tesla.com/api/1/vehicles/${configObj.vehicleId}/command/flash_lights`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' }
        });
        if (res.ok) addLog('💡 전조등/비상등 점등 성공!');
        else addLog(`❌ 전조등 실행 실패: ${res.status}`);
      } catch (err) { 
        addLog(`❌ 전조등 실행 실패: ${err.message}`); 
      }
    }

    async function sendNtfyNotification(title, message, priority = 'high') {
      const topic = configObj.ntfyTopic || 'MJYAz6ZyjXiujaTDpJ';
      try {
        const res = await fetch(`https://ntfy.sh/${topic}`, {
          method: 'POST',
          headers: { 'Title': title, 'Priority': priority, 'Tags': 'car,warning' },
          body: message
        });
        if (res.ok) addLog('📱 [자동] ntfy 푸시 알림 발송 완료');
      } catch (err) { addLog(`❌ ntfy 알림 오류: ${err.message}`); }
    }

    function testFlashLights() { if(accessToken) flashLights(); else alert('테슬라 로그인을 진행해 주세요.'); }
    function testNtfy() { sendNtfyNotification('Tesla Guardian Test', 'This is a test notification.'); }

    async function triggerGitHubSync() {
      if (!configObj.ghToken) { alert("⚙️ 설정에서 GitHub Token을 입력해 주세요."); openConfigModal(); return; }
      try {
        const res = await fetch('https://api.github.com/repos/mdkdw1-ui/my-tesla-app/actions/workflows/sync.yml/dispatches', {
          method: 'POST',
          headers: {
            'Accept': 'application/vnd.github+json',
            'Authorization': `Bearer ${configObj.ghToken}`,
            'X-GitHub-Api-Version': '2022-11-28'
          },
          body: JSON.stringify({ ref: 'main' })
        });
        if (res.ok) addLog('⚡ GitHub Sync 트리거 성공');
        else addLog(`❌ Sync 실패: ${res.status}`);
      } catch (e) { addLog(`❌ Sync 에러: ${e.message}`); }
    }
  </script>
