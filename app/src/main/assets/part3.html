<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex-1 w-full space-y-6">

    <section id="tab-content-map" class="space-y-4">
        <div class="glass-panel p-3 flex flex-wrap gap-2 items-center justify-between">
            <div class="flex gap-1.5 bg-slate-900/60 p-1 rounded-lg border border-slate-800">
                <button onclick="setMapFilterMode('single')" id="mode-btn-single" class="mode-btn text-xs px-3 py-1.5 rounded-md font-medium text-white bg-slate-700">단일 운행</button>
                <button onclick="setMapFilterMode('daily')" id="mode-btn-daily" class="mode-btn text-xs px-3 py-1.5 rounded-md font-medium text-slate-400 hover:text-white">일간</button>
                <button onclick="setMapFilterMode('weekly')" id="mode-btn-weekly" class="mode-btn text-xs px-3 py-1.5 rounded-md font-medium text-slate-400 hover:text-white">주간</button>
                <button onclick="setMapFilterMode('monthly')" id="mode-btn-monthly" class="mode-btn text-xs px-3 py-1.5 rounded-md font-medium text-slate-400 hover:text-white">월간</button>
                <button onclick="setMapFilterMode('quarterly')" id="mode-btn-quarterly" class="mode-btn text-xs px-3 py-1.5 rounded-md font-medium text-slate-400 hover:text-white">분기</button>
            </div>
            <div id="map-mode-title" class="text-xs text-sky-400 font-semibold px-2">단일 운행 상세 모드</div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <div class="lg:col-span-2 glass-panel h-[480px] relative overflow-hidden" id="kakao-map-container">
                <div id="map" class="w-full h-full"></div>
            </div>

            <div class="glass-panel p-4 flex flex-col justify-between h-[480px] overflow-y-auto" id="map-detail-side-panel">
                <div>
                    <h3 class="text-base font-bold text-white mb-3 border-b border-slate-700 pb-2 flex items-center justify-between">
                        <span id="detail-panel-title">운행 상세 정보</span>
                        <span id="detail-panel-badge" class="text-xs px-2 py-0.5 rounded bg-sky-500/20 text-sky-300">--</span>
                    </h3>
                    <div id="detail-panel-content" class="space-y-3 text-xs text-slate-300"></div>
                </div>
                <div id="detail-panel-sublist" class="mt-4 border-t border-slate-700/80 pt-3 max-h-[160px] overflow-y-auto">
                    <div class="text-[11px] text-slate-400 mb-1 font-semibold">포함된 단일 운행 목록 (클릭시 이동)</div>
                    <div id="sublist-items" class="space-y-1"></div>
                </div>
            </div>
        </div>
    </section>

    <section id="tab-content-history" class="hidden space-y-4">
        <div class="glass-panel p-4">
            <h2 class="text-lg font-bold text-white mb-4">최근 운행일 전체 기록</h2>
            <div id="history-list-container" class="space-y-3"></div>
        </div>
    </section>

    <section id="tab-content-status-history" class="hidden space-y-4">
        <div class="glass-panel p-4">
            <h2 class="text-lg font-bold text-white mb-4">최근 상태 히스토리</h2>
            <div id="status-history-container" class="space-y-4"></div>
        </div>
    </section>

    <section id="tab-content-battery" class="hidden space-y-4">
        <div class="glass-panel p-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-white">배터리 & 외기 온도 히스토리 (최근 50개)</h2>
                <span class="text-xs text-slate-400">최근 50개 정보 연동</span>
            </div>
            <div class="h-80 w-full">
                <canvas id="batteryChart"></canvas>
            </div>
        </div>
    </section>

    <section id="tab-content-guardian" class="hidden space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="glass-panel p-5">
                <h3 class="text-base font-bold text-white mb-3">테슬라 계정 로그인 & 토큰 관리</h3>
                <form id="tesla-login-form" onsubmit="handleTeslaLogin(event)" class="space-y-3 text-xs">
                    <div>
                        <label class="block text-slate-400 mb-1">Tesla 계정 Email</label>
                        <input type="email" id="tesla-email" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white" placeholder="user@example.com" required>
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">비밀번호 / Refresh Token</label>
                        <input type="password" id="tesla-password" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-semibold py-2 rounded">인증 토큰 발급 및 접속</button>
                </form>

                <div class="mt-4 pt-3 border-t border-slate-700">
                    <label class="block text-xs text-slate-400 mb-1">현재 활성화된 OAuth Token</label>
                    <div class="bg-slate-900/90 p-2.5 rounded border border-slate-800 text-[11px] text-sky-400 font-mono break-all" id="active-token-display">
                        eyJhbGciOiJSUzI1NiIsImRhdGEiOiJBY3RpdmVUb2tlbiJ9...
                    </div>
                </div>
            </div>

            <div class="glass-panel p-5">
                <h3 class="text-base font-bold text-white mb-3">감시 모드 (Sentry Guardian) 제어</h3>
                <div class="flex justify-between items-center p-3 bg-slate-800/60 rounded border border-slate-700 text-xs">
                    <div>
                        <div class="font-semibold text-white">Sentry Mode Status</div>
                        <div class="text-slate-400 text-[11px]">실시간 상태 감시 중</div>
                    </div>
                    <button onclick="toggleSentryMode()" id="sentry-toggle-btn" class="bg-red-500/20 text-red-400 border border-red-500/40 px-3 py-1.5 rounded font-bold hover:bg-red-500/30">
                        ACTIVE
                    </button>
                </div>
            </div>
        </div>
    </section>
</main>
