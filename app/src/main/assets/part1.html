<style>
    :root {
        --bg-dark: #0f172a;
        --panel-bg: rgba(30, 41, 59, 0.75);
        --panel-border: rgba(255, 255, 255, 0.08);
        --neon-blue: #38bdf8;
        --neon-green: #34d399;
    }

    body {
        background-color: var(--bg-dark);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .glass-panel {
        background: var(--panel-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--panel-border);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        border-radius: 1rem;
        transition: all 0.25s ease;
    }

    .glass-panel:hover {
        border-color: rgba(56, 189, 248, 0.3);
        box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5), 0 0 15px rgba(56, 189, 248, 0.1);
    }

    .clickable-card {
        cursor: pointer;
        transition: transform 0.15s ease, background-color 0.15s ease;
    }
    .clickable-card:hover {
        transform: translateY(-2px);
        background-color: rgba(51, 65, 85, 0.8);
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.5); border-radius: 3px; }
</style>

<header class="sticky top-0 z-50 glass-panel rounded-none border-b border-slate-700/50 px-6 py-4 mb-6">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-car-side text-2xl text-sky-400"></i>
            <h1 class="text-xl font-bold tracking-wider text-white">TESLA DASH <span class="text-xs px-2 py-0.5 rounded bg-sky-500/20 text-sky-400 border border-sky-500/30">PRO</span></h1>
        </div>

        <div class="flex items-center space-x-3">
            <button id="btn-sync-all" onclick="handleGlobalSync()" class="flex items-center space-x-2 bg-sky-600 hover:bg-sky-500 text-white px-4 py-2 rounded-lg font-medium text-sm transition-all shadow-lg shadow-sky-600/30 active:scale-95">
                <i class="fa-solid fa-rotate text-sm" id="sync-icon"></i>
                <span>갱신</span>
            </button>
            
            <button id="btn-settings" onclick="openSettingsModal()" class="flex items-center space-x-2 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-2 rounded-lg text-sm transition-all">
                <i class="fa-solid fa-gear"></i>
                <span class="hidden sm:inline">설정</span>
            </button>
        </div>
    </div>
</header>
