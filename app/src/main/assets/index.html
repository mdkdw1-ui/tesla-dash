<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Dash Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen flex flex-col antialiased bg-slate-900 text-slate-100">

    <div id="part1-container"></div>

    <div id="part2-container"></div>

    <div id="part3-container"></div>

    <div id="part4-container"></div>

    <div id="part5-container"></div>

    <script>
        // HTML 조각 파일 순차 로드 (Android Webview / Local File System 호환)
        async function loadParts() {
            const parts = ['part1.html', 'part2.html', 'part3.html', 'part4.html', 'part5.html'];
            for (let i = 0; i < parts.length; i++) {
                try {
                    const response = await fetch(parts[i]);
                    const html = await response.text();
                    document.getElementById(`part${i+1}-container`).innerHTML = html;
                } catch (err) {
                    console.error(`Error loading ${parts[i]}:`, err);
                }
            }
            // 전체로드 완료 후 초기화 실행
            if (typeof initTeslaDashApp === 'function') {
                initTeslaDashApp();
            }
        }
        window.addEventListener('DOMContentLoaded', loadParts);
    </script>
</body>
</html>
