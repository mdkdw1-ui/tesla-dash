<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tesla Command Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { background-color: #0d0e12; color: #f3f4f6; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card-dark { background-color: #161820; border: 1px solid #262936; }
    .card-border-amber { border: 1px solid #d97706; }
    .card-border-blue { border: 1px solid #2563eb; }
    
    /* Custom Toggle Switch */
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #374151; transition: .3s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #ef4444; }
    input:checked + .slider:before { transform: translateX(20px); }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #12141c; }
    ::-webkit-scrollbar-thumb { background: #262936; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #374151; }
  </style>
</head>
<body class="bg-[#0d0e12] text-gray-100 min-h-screen flex flex-col antialiased font-sans select-none pb-10">

  <header class="bg-[#12141c] border-b border-gray-800/80 px-4 py-3 flex justify-between items-center sticky top-0 z-50 backdrop-blur-md bg-opacity-90">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-red-600 to-amber-500 flex items-center justify-center font-black text-white shadow-lg shadow-red-500/20">
        T
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-tight text-white flex items-center gap-1.5">
          Tesla Command Hub <span id="app-version-badge" class="text-[9px] px-1.5 py-0.2 rounded-full bg-red-500/20 text-red-400 border border-red-500/30 font-mono">v3.5</span>
        </h1>
        <p class="text-[10px] text-gray-400 font-medium">실시간 동기화 & 가디언 모니터</p>
      </div>
    </div>
    
    <div class="flex items-center gap-1.5">
      <button id="btn-unified-sync" onclick="unifiedSyncAndRefresh()" title="데이터 전체 동기화 및 갱신" class="p-1.5 sm:px-2.5 sm:py-1 text-xs font-semibold rounded-lg bg-blue-600/20 hover:bg-blue-600/40 text-blue-400 border border-blue-500/40 transition active:scale-95 flex items-center gap-1">
        <i id="icon-unified-sync" class="fa-solid fa-arrows-rotate"></i> <span class="hidden sm:inline">갱신 / Sync</span>
      </button>
      <button onclick="openConfigModal()" title="설정" class="p-1.5 sm:px-2.5 sm:py-1 text-xs font-semibold rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-700 transition active:scale-95 flex items-center gap-1">
        <i class="fa-solid fa-gear"></i> <span class="hidden sm:inline">설정</span>
      </button>
    </div>
  </header>

  <div class="bg-[#12141c] border-b border-gray-800/80 p-2">
    <div class="grid grid-cols-2 gap-2 max-w-2xl mx-auto">
      <button onclick="switchMainTab('monitor')" id="btn-main-monitor" class="py-2.5 rounded-xl font-bold text-sm bg-blue-600 text-white shadow-lg shadow-blue-600/20 transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-chart-line"></i> 테슬라 모니터
      </button>
      <button onclick="switchMainTab('guardian')" id="btn-main-guardian" class="py-2.5 rounded-xl font-bold text-sm bg-gray-800 text-gray-400 hover:bg-gray-700 transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-shield-halved"></i> 감시 가디언
      </button>
    </div>
  </div>
