  <script>
    function initDashboard() {
      loadKakaoSdk(configObj.kakaoKey, () => {
        initMap();
        handleRefresh(false);
      });
    }

    function loadKakaoSdk(appKey, callback) {
      if (window.kakao && window.kakao.maps) { 
        kakao.maps.load(() => { geocoder = new kakao.maps.services.Geocoder(); callback(); }); 
        return; 
      }
      const script = document.createElement('script');
      script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${appKey}&autoload=false&libraries=services`;
      script.onload = () => { kakao.maps.load(() => { geocoder = new kakao.maps.services.Geocoder(); callback(); }); };
      document.head.appendChild(script);
    }

    function initMap() {
      const container = document.getElementById('map');
      if (container) {
        map = new kakao.maps.Map(container, { center: new kakao.maps.LatLng(37.5665, 126.9780), level: 5 });
      }
    }

    async function fetchSupabaseTable(queryPath) {
      if (!configObj.url || !configObj.key) return [];
      try {
        const cleanUrl = configObj.url.replace(/\/$/, "");
        const res = await fetch(`${cleanUrl}/rest/v1/${queryPath}`, {
          headers: { 
            'apikey': configObj.key, 
            'Authorization': `Bearer ${configObj.key}`, 
            'Range': '0-9999' 
          }
        });
        if (!res.ok) {
          const errText = await res.text();
          addLog(`❌ DB 데이터 불러오기 에러 [HTTP ${res.status}]: ${errText}`);
          return [];
        }
        return await res.json();
      } catch (e) {
        addLog(`❌ DB 네트워크 에러: ${e.message}`);
        return [];
      }
    }

    /**
     * [단일 통합 갱신 실행 함수]
     * Vercel Sync API 호출 -> Supabase 동기화 -> 데이터 재조회 및 렌더링
     */
    async function handleRefresh(manualTrigger = true) {
      if (manualTrigger) addLog('🔄 [갱신] 데이터 동기화 및 조회를 시작합니다...');
      
      // 1. Vercel Sync API 실행 (teslacam-93532 -> Supabase)
      try {
        const syncRes = await fetch('https://my-tesla-app-six.vercel.app/api/sync');
        if (syncRes.ok) {
          const syncData = await syncRes.json();
          if (syncData.success) {
            addLog(`✅ [동기화 완료] 총 ${syncData.count || 0}건의 데이터가 Supabase로 동기화되었습니다.`);
          } else {
            addLog(`⚠️ [동기화 주의] sync.js 응답 코드: ${syncData.error || '알 수 없는 오류'}`);
          }
        } else {
          addLog(`❌ [동기화 실패] Vercel API 응답 상태: HTTP ${syncRes.status}`);
        }
      } catch (err) {
        addLog(`❌ [동기화 에러] Vercel Sync 연동 실패: ${err.message}`);
      }

      // 2. Supabase 최신 데이터 Fetching
      try {
        const [dData, vData] = await Promise.all([
          fetchSupabaseTable('driving?select=*&order=created_at.desc'),
          fetchSupabaseTable('vehicle_status?select=*&order=created_at.desc&limit=1')
        ]);

        if (dData && dData.length > 0) {
          allTrips = dData.map(t => {
            const timeVal = t.created_at || t.timestamp || t.start_time || new Date().toISOString();
            const moveKMVal = Number(t.move_km ?? t.moveKM ?? 0);
            const useBatVal = Number(t.use_battery ?? t.useBattery ?? 0);
            const durationMinVal = parseDrivingTimeToMinutes(t);
            
            return {
              ...t,
              timestamp: timeVal,
              moveKM: moveKMVal,
              useBattery: useBatVal,
              durationMin: durationMinVal,
              startDong: t.start_dong || t.start_address || '위치 미상',
              endDong: t.end_dong || t.end_address || '위치 미상'
            };
          });
        } else {
          allTrips = [];
        }

        vehicleRows = vData || [];

        // 3. UI 렌더링 update
        renderDrivingData();
        renderVehicleInfo();
        renderMonthlyReport();
        if (manualTrigger) addLog('✨ 화면 데이터가 최신으로 갱신되었습니다.');
      } catch (err) {
        addLog(`❌ [데이터 조회 에러] ${err.message}`);
      }
    }

    /**
     * 5am 운행일 그룹핑 및 25시 시각 표기가 반영된 주행 리스트 렌더링
     */
    function renderDrivingData() {
      const listContainer = document.getElementById('driving-list-container');
      if (!listContainer) return;
      
      if (!allTrips || allTrips.length === 0) {
        listContainer.innerHTML = `<div class="p-8 text-center text-gray-500 text-xs">주행 기록이 없습니다.</div>`;
        return;
      }

      // 5am 운행일 기준으로 그룹화
      const grouped = {};
      allTrips.forEach(item => {
        const drivingDate = getDrivingDateStr(item.timestamp);
        if (!grouped[drivingDate]) grouped[drivingDate] = [];
        grouped[drivingDate].push(item);
      });

      let html = '';
      const sortedDates = Object.keys(grouped).sort().reverse();

      sortedDates.forEach(dateStr => {
        const dayItems = grouped[dateStr];
        const dayKM = dayItems.reduce((acc, cur) => acc + (cur.moveKM || 0), 0);
        const dayBat = dayItems.reduce((acc, cur) => acc + (cur.useBattery || 0), 0);
        const headerText = formatDrivingDayHeader(dateStr);

        html += `
          <div class="card-dark rounded-2xl p-3 space-y-2 border border-gray-800">
            <div class="flex justify-between items-center border-b border-gray-800/80 pb-2 px-1">
              <span class="text-xs font-bold text-gray-200">📅 ${headerText}</span>
              <span class="text-[11px] font-semibold text-blue-400">총 ${dayKM.toFixed(1)}km (${dayBat.toFixed(1)}%)</span>
            </div>
            <div class="space-y-2">
        `;

        dayItems.forEach(evt => {
          const startTimeDisplay = formatDrivingTimeStr(evt.start_time || evt.timestamp);
          const endTimeDisplay = evt.end_time ? formatDrivingTimeStr(evt.end_time) : '';
          const timeRangeStr = endTimeDisplay ? `${startTimeDisplay} ~ ${endTimeDisplay}` : startTimeDisplay;

          const isCharge = evt.is_charge || evt.type === 'charge' || (evt.moveKM === 0 && evt.useBattery < 0);
          
          if (!isCharge) {
            const batDetail = evt.useBattery !== undefined ? `${evt.useBattery.toFixed(1)}%` : '-';
            const odoVal = evt.odo ? Number(evt.odo).toLocaleString() : '-';

            html += `
              <div class="bg-[#0d0e12] p-2.5 rounded-xl border border-gray-800/80 space-y-1.5 hover:border-blue-500/40 transition">
                <div class="flex justify-between items-center text-xs">
                  <div class="flex items-center space-x-2">
                    <span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-blue-600/20 text-blue-400 border border-blue-500/30">주행</span>
                    <span class="text-gray-400 text-[11px] font-mono">${timeRangeStr}</span>
                  </div>
                  <span class="font-black text-blue-400 text-xs">+${evt.moveKM.toFixed(1)} km</span>
                </div>
                <div class="flex items-center space-x-1.5 text-xs pt-0.5">
                  <span class="address-tag text-blue-300 font-semibold">${evt.startDong}</span>
                  <span class="text-indigo-400 font-bold">→</span>
                  <span class="address-tag text-emerald-300 font-semibold">${evt.endDong}</span>
                </div>
                <div class="text-gray-400 text-[11px] leading-relaxed">
                  주행 ${evt.moveKM.toFixed(1)}km, 시간 ${evt.durationMin ? evt.durationMin + '분' : '-'}, 배터리 사용 ${batDetail}, 누적 ${odoVal}km
                </div>
              </div>
            `;
          } else {
            const batDiffAbs = Math.abs(evt.useBattery || 0);
            html += `
              <div class="bg-[#0d0e12] p-2.5 rounded-xl border border-gray-800/80 flex justify-between items-center text-xs">
                <div class="flex items-center space-x-2">
                  <span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-emerald-600/20 text-emerald-400 border border-emerald-500/30">⚡ 충전</span>
                  <span class="text-gray-400 text-[11px] font-mono">${startTimeDisplay}</span>
                </div>
                <div class="text-right">
                  <span class="font-bold text-emerald-400 text-[11px]">충전 +${batDiffAbs.toFixed(1)}%</span>
                </div>
              </div>
            `;
          }
        });

        html += `
            </div>
          </div>
        `;
      });

      listContainer.innerHTML = html;
    }

    function renderVehicleInfo() {
      if (!vehicleRows || vehicleRows.length === 0) return;
      const v = vehicleRows[0];

      const batEl = document.getElementById('v-bat-level');
      if (batEl) batEl.textContent = `${v.battery_level ?? '-'}%`;

      const rangeEl = document.getElementById('v-est-range');
      if (rangeEl) rangeEl.textContent = `${v.est_battery_range ? Number(v.est_battery_range).toFixed(1) : '-'} km`;

      const odoEl = document.getElementById('v-odometer');
      if (odoEl) odoEl.textContent = `${v.odometer ? Number(v.odometer).toLocaleString() : '-'} km`;

      const stateEl = document.getElementById('v-state');
      if (stateEl) stateEl.textContent = v.state || '대기';
    }

    /**
     * 5am 운행일 기준으로 월간 데이터 집계 렌더링
     */
    function renderMonthlyReport() {
      const mList = document.getElementById('monthly-report-list');
      if (!mList) return;

      if (!allTrips || allTrips.length === 0) {
        mList.innerHTML = `<div class="p-6 text-center text-gray-500 text-xs">데이터가 없습니다.</div>`;
        return;
      }

      // 5am 기준 운행월 그룹화 (YYYY-MM)
      const monthlyData = {};
      allTrips.forEach(t => {
        const dStr = getDrivingDateStr(t.timestamp);
        const monthKey = dStr.slice(0, 7); // YYYY-MM
        if (!monthlyData[monthKey]) monthlyData[monthKey] = { totalKM: 0, count: 0, bat: 0 };
        monthlyData[monthKey].totalKM += (t.moveKM || 0);
        monthlyData[monthKey].bat += (t.useBattery || 0);
        monthlyData[monthKey].count += 1;
      });

      let html = '';
      const months = Object.keys(monthlyData).sort().reverse();

      months.forEach(m => {
        const data = monthlyData[m];
        html += `
          <div class="card-dark p-3.5 rounded-xl border border-gray-800 flex justify-between items-center text-xs">
            <div>
              <span class="font-bold text-gray-200 text-sm block">${m}</span>
              <span class="text-gray-400 text-[11px]">총 ${data.count}회 운행</span>
            </div>
            <div class="text-right">
              <span class="text-blue-400 font-extrabold text-sm block">${data.totalKM.toFixed(1)} km</span>
              <span class="text-gray-400 text-[11px]">소모 배터리 ${data.bat.toFixed(1)}%</span>
            </div>
          </div>
        `;
      });

      mList.innerHTML = html;
    }
  </script>
