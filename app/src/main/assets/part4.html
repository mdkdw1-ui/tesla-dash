<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-6 pb-12">
    <section class="glass-panel p-4">
        <div class="flex justify-between items-center mb-2">
            <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-terminal text-sky-400"></i> 네트워크 및 모니터링 통합 디버그 로그
            </h3>
            <button onclick="clearDebugLogs()" class="text-[11px] text-slate-500 hover:text-slate-300">로그 지우기</button>
        </div>
        <div id="debug-log-console" class="bg-slate-950 p-3 rounded-lg border border-slate-800 font-mono text-[11px] text-emerald-400 h-32 overflow-y-auto space-y-1">
            <div>[SYSTEM] Tesla Dash Pro Subsystem Ready.</div>
        </div>
    </section>
</main>

<div id="settings-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="glass-panel w-full max-w-md p-6 relative space-y-4">
        <h3 class="text-lg font-bold text-white">환경 설정</h3>
        <div class="space-y-3 text-xs">
            <div>
                <label class="block text-slate-400 mb-1">Supabase URL</label>
                <input type="text" id="cfg-supabase-url" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white" value="https://myteslabot.supabase.co">
            </div>
            <div>
                <label class="block text-slate-400 mb-1">Supabase Anon Key</label>
                <input type="password" id="cfg-supabase-key" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white" value="eyxxxxx">
            </div>
        </div>
        <div class="flex justify-end space-x-2 pt-2">
            <button onclick="closeSettingsModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded hover:bg-slate-700 text-xs">취소</button>
            <button onclick="saveSettingsModal()" class="px-4 py-2 bg-sky-600 text-white rounded hover:bg-sky-500 text-xs font-bold">저장</button>
        </div>
    </div>
</div>
