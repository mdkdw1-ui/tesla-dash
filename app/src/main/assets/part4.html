<script>
// ==========================================
// 1. 주소 및 시간 가공 헬퍼 함수
// ==========================================

// 광역시/도 및 시 명칭 제거 (주소 간소화)
function cleanAddress(addr) {
  if (!addr) return '';
  return String(addr)
    .replace(/(서울특별시|경기도|인천광역시|부산광역시|대구광역시|광주광역시|대전광역시|울산광역시|세종특별자치시|제주특별자치도|강원특별자치도|전북특별자치도|충청북도|충청남도|전라북도|전라남도|경상북도|경상남도)/g, '')
    .replace(/(고양시|성남시|수원시|용인시|부천시|안산시|안양시|청주시|천안시|전주시|포항시|창원시|화성시|파주시|김포시|광명시|군포시|이천시|양주시|구리시|안성시|하남시|의왕시|여주시|동두천시|과천시|남양주시)/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

// 새벽 5시 기준 운행일 Date 객체 반환 (시간 - 5시간 차감)
function getDrivingDateObj(dateStr) {
  if (!dateStr) return new Date();
  const dateVal = new Date(String(dateStr).replace(' ', 'T'));
  if (isNaN(dateVal.getTime())) return new Date();
  // 5시간 차감 (5 * 60 * 60 * 1000 ms)
  return new Date(dateVal.getTime() - 18000000);
}

// 새벽 5시 기준 YYYY-MM-DD 키 추출
function getDrivingDateStr(dateStr) {
  const adjusted = getDrivingDateObj(dateStr);
  const yyyy = adjusted.getFullYear();
  const mm = String(adjusted.getMonth() + 1).padStart(2, '0');
  const dd = String(adjusted.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

// 시각 표기 포맷터 (00시~04시 -> 24시~28시 표기)
function formatDrivingTimeStr(dateStr) {
  if (!dateStr) return '--:--';
  const original = new Date(String(dateStr).replace(' ', 'T'));
  if (isNaN(original.getTime())) return '--:--';

  let hours = original.getHours();
  const minutes = String(original.getMinutes()).padStart(2, '0');

  // 새벽 00:00 ~ 04:59 범위인 경우 24시 ~ 28시로 표기
  if (hours >= 0 && hours < 5) {
    hours += 24;
  }

  const period = hours >= 12 && hours < 24 ? '오후' : (hours >= 24 ? '새벽' : '오전');
  let displayHours = hours;
  if (hours > 12 && hours < 24) displayHours = hours - 12;
  if (hours >= 24) displayHours = hours - 24;

  return `${period} ${String(displayHours).padStart(2, '0')}:${minutes}`;
}

// driving_time 복구 및 분 단위 환산 함수 (NULL 완벽 대응)
function getCalculatedDrivingTime(row) {
  // 1순위: DB 컬럼 필드값 확인
  let timeVal = row.driving_time ?? row.duration ?? row.duration_min ?? row.drive_time;
  
  if (timeVal !== null && timeVal !== undefined && !isNaN(timeVal) && Number(timeVal) > 0) {
    timeVal = Number(timeVal);
    // 초(sec) 단위로 들어왔을 경우 분으로 환산
    return (timeVal > 300 && timeVal % 60 === 0) ? Math.round(timeVal / 60) : Math.round(timeVal);
  }

  // 2순위: start_time과 end_time 시간차 연산
  if (row.start_time && row.end_time) {
    const tStart = new Date(String(row.start_time).replace(' ', 'T'));
    const tEnd = new Date(String(row.end_time).replace(' ', 'T'));
    if (!isNaN(tStart.getTime()) && !isNaN(tEnd.getTime())) {
      const diffMins = Math.round((tEnd - tStart) / (1000 * 60));
      if (diffMins > 0) return diffMins;
    }
  }

  // 3순위: location 좌표 배열 타임스탬프 차이 연산
  if (Array.isArray(row.location) && row.location.length >= 2) {
    const pFirst = row.location[0];
    const pLast = row.location[row.location.length - 1];
    const t1 = new Date(pFirst.time || pFirst.timestamp);
    const t2 = new Date(pLast.time || pLast.timestamp);
    if (!isNaN(t1.getTime()) && !isNaN(t2.getTime())) {
      const diffMins = Math.round((t2 - t1) / (1000 * 60));
      if (diffMins > 0) return diffMins;
    }
  }

  return 0; // 연산 불가 시 0분
}

// 출발지 / 도착지 주소 정제 추출
function getFormattedAddress(row) {
  let start = row.start_dong || row.start_address || row.start_location;
  let end = row.end_dong || row.end_address || row.end_location;

  start = start ? cleanAddress(start) : '출발지 미상';
  end = end ? cleanAddress(end) : '도착지 미상';

  return { start, end };
}


// ==========================================
// 2. Supabase DB 조회 및 UI 렌더링
// ==========================================

async function fetchSupabaseData() {
  const logBox = document.getElementById('tmLogBox');
  const addLog = (msg) => {
    if (logBox) {
      logBox.innerHTML += `<div>${new Date().toLocaleTimeString()} - ${msg}</div>`;
      logBox.scrollTop = logBox.scrollHeight;
    }
    console.log(msg);
  };

  addLog('🔄 Supabase 주행 데이터 수집 시작...');

  const spUrl = window.SUPABASE_URL || localStorage.getItem('tm_sp_url');
  const spKey = window.SUPABASE_ANON_KEY || localStorage.getItem('tm_sp_key');

  if (!spUrl || !spKey) {
    addLog('❌ Supabase 설정 정보(URL/KEY)가 누락되었습니다.');
    return;
  }

  try {
    const response = await fetch(`${spUrl}/rest/v1/driving?select=*&order=start_time.desc`, {
      method: 'GET',
      headers: {
        'apikey': spKey,
        'Authorization': `Bearer ${spKey}`,
        'Content-Type': 'application/json'
      }
    });

    if (!response.ok) {
      const errText = await response.text();
      addLog(`❌ Supabase Fetch Error (driving) [HTTP ${response.status}]: ${errText}`);
      return;
    }

    const drivingData = await response.json();
    addLog(`✅ Supabase 주행 데이터 ${drivingData.length}건 조회 완료`);

    // 전역 변수 저장
    window.tmDrivingData = drivingData;

    // UI 렌더링 호출
    renderDrivingList(drivingData);

  } catch (err) {
    addLog(`❌ 네트워크/스크립트 에러: ${err.message}`);
  }
}

// 주행 데이터 리스트 화면 카드 출력 (5am 운행일 그룹핑 적용)
function renderDrivingList(data) {
  const container = document.getElementById('tmDrivingListContainer');
  if (!container) return;

  if (!data || data.length === 0) {
    container.innerHTML = '<div style="text-align:center; padding: 40px; color: #888;">주행 데이터가 없습니다.</div>';
    return;
  }

  // 1. 5am 기준 운행일별 그룹핑
  const grouped = {};
  data.forEach(row => {
    const dateKey = getDrivingDateStr(row.start_time);
    if (!grouped[dateKey]) grouped[dateKey] = [];
    grouped[dateKey].push(row);
  });

  // 날짜 내림차순 정렬
  const sortedDates = Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a));

  let html = '';

  sortedDates.forEach(dateKey => {
    const items = grouped[dateKey];
    const dateParts = dateKey.split('-');
    const displayHeaderDate = `${parseInt(dateParts[1])}월 ${parseInt(dateParts[2])}일`;

    html += `
      <div style="margin-bottom: 20px;">
        <div style="font-size: 15px; font-weight: bold; color: #a1a1aa; margin: 12px 4px 8px 4px; display: flex; align-items: center; gap: 6px;">
          <span>📅 ${displayHeaderDate}</span>
        </div>
    `;

    items.forEach(row => {
      const driveTimeMin = getCalculatedDrivingTime(row);
      const timeStr = driveTimeMin > 0 ? `${driveTimeMin}분` : '-';
      const formattedTime = formatDrivingTimeStr(row.start_time);
      const { start, end } = getFormattedAddress(row);
      const distance = row.distance ? Math.round(row.distance) : 0;
      const batteryUsed = row.used_battery ? Math.abs(Math.round(row.used_battery)) : 0;
      const totalDist = row.total_distance ? Number(row.total_distance).toLocaleString() : '-';

      html += `
        <div style="background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 14px; margin-bottom: 10px; color: #fff;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="background: #2563eb; color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: bold;">주행</span>
              <span style="font-size: 14px; font-weight: 600; color: #f4f4f5;">${formattedTime}</span>
            </div>
            <div style="font-size: 14px; font-weight: bold; color: #38bdf8;">
              ${start} <span style="color: #71717a;">➔</span> ${end}
            </div>
          </div>
          <div style="font-size: 13px; color: #a1a1aa; display: flex; gap: 12px; flex-wrap: wrap;">
            <span>주행 ${distance}km</span>
            <span>시간 ${timeStr}</span>
            <span>배터리 ${batteryUsed}%</span>
            <span>총 주행거리 ${totalDist}km</span>
          </div>
        </div>
      `;
    });

    html += `</div>`;
  });

  container.innerHTML = html;
}
</script>
