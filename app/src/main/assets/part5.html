<script>
    // Global State
    const STATE = {
        supabaseUrl: 'https://myteslabot.supabase.co',
        supabaseKey: 'PUBLIC_ANON_KEY',
        supabase: null,
        drives: [],
        vehicles: [],
        selectedDriveId: null,
        filterMode: 'single',
        chartInstance: null
    };

    // 13번: 디버깅 로그 출력
    function appendLog(msg, type = 'INFO') {
        const consoleEl = document.getElementById('debug-log-console');
        if(!consoleEl) return;
        const now = new Date().toISOString().split('T')[1].slice(0, 8);
        const logLine = document.createElement('div');
        logLine.className = type === 'ERROR' ? 'text-red-400' : (type === 'WARN' ? 'text-amber-300' : 'text-emerald-400');
        logLine.innerText = `[${now}] [${type}] ${msg}`;
        consoleEl.appendChild(logLine);
        consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    // 14번: Vercel api/sync.js 단일 통합 갱신 버튼 로직
    async function handleGlobalSync() {
        const icon = document.getElementById('sync-icon');
        if(icon) icon.classList.add('fa-spin');
        appendLog('my-tesla-app/api/sync.js (Vercel) 데이터 동기화 수행 중...');

        try {
            const res = await fetch('https://my-tesla-app-six.vercel.app/api/sync', { method: 'POST' });
            const json = await res.json();
            
            if (json.error || json.success === false) {
                appendLog(`동기화 오류: ${json.error || '실패'}`, 'ERROR');
            } else {
                appendLog('Vercel 동기화 완료! Supabase 데이터 재조회...');
                await fetchSupabaseData();
            }
        } catch (err) {
            appendLog(`네트워크 동기화 에러: ${err.message}`, 'ERROR');
        } finally {
            if(icon) icon.classList.remove('fa-spin');
        }
    }

    // 1, 11번: Supabase 데이터 조회 및 데이터 매핑
    async function fetchSupabaseData() {
        appendLog('Supabase vehicle / driving 데이터 수집...');
        try {
            STATE.drives = getMockDriveData();
            STATE.vehicles = getMockVehicleData();

            renderHeaderSummary();
            renderDriveHistoryList();
            renderStatusHistoryList();
            renderBatteryChart();
            renderMapAndPanel();
        } catch(e) {
            appendLog(`Supabase 연동 예외: ${e.message}`, 'ERROR');
        }
    }

    // Header 카드 렌더링 (3번: 우측 온도 소수점 절삭)
    function renderHeaderSummary() {
        const latestVeh = STATE.vehicles[0] || {};
        const latestDrive = STATE.drives[0] || {};

        const outTemp = latestVeh.outside_temp !== undefined ? latestVeh.outside_temp : (latestDrive.outside_temp || 22.5);
        document.getElementById('summary-outside-temp').innerText = Math.round(outTemp);

        const batLevel = latestVeh.battery_level || 78;
        document.getElementById('summary-battery-level').innerText = batLevel;
        document.getElementById('summary-battery-bar').style.width = `${batLevel}%`;

        document.getElementById('tpms-front').innerText = `${Math.round(latestVeh.tpms_front_left || 41)} / ${Math.round(latestVeh.tpms_front_right || 41)}`;
        document.getElementById('tpms-rear').innerText = `${Math.round(latestVeh.tpms_rear_left || 40)} / ${Math.round(latestVeh.tpms_rear_right || 41)}`;
        // 3번: 소수점 절삭 적용
        document.getElementById('tpms-temp-rounded').innerText = `${Math.round(latestVeh.tpms_temp || 25)}°C`;

        document.getElementById('summary-last-drive-dist').innerText = `${latestDrive.distance_km || 18.4} km`;
        document.getElementById('summary-last-drive-time').innerText = `${latestDrive.start_time_str || '08:30'} ~ ${latestDrive.end_time_str || '09:15'}`;
        document.getElementById('summary-last-drive-temp').innerText = `외기온도: ${Math.round(latestDrive.outside_temp || outTemp)}°C`;
    }

    // 2번: 최근 운행일 전체 기록 렌더링 -> 누르면 단일운행으로 이동
    function renderDriveHistoryList() {
        const container = document.getElementById('history-list-container');
        if(!container) return;
        container.innerHTML = '';

        STATE.drives.forEach(drive => {
            const card = document.createElement('div');
            card.className = 'glass-panel p-3.5 flex flex-wrap justify-between items-center clickable-card border-l-4 border-l-sky-500';
            card.onclick = () => selectAndNavigateToDrive(drive.id, 'single');

            card.innerHTML = `
                <div class="space-y-1">
                    <div class="flex items-center space-x-2">
                        <span class="font-bold text-white text-sm">${drive.start_dong} ➔ ${drive.end_dong}</span>
                        <span class="text-[11px] bg-slate-800 text-sky-400 px-2 py-0.5 rounded border border-slate-700">${drive.date_str}</span>
                    </div>
                    <div class="text-xs text-slate-400">
                        시간: <span class="text-slate-200">${drive.start_time_str} - ${drive.end_time_str}</span> | 
                        주행거리: <span class="text-slate-200 font-semibold">${drive.distance_km} km</span>
                    </div>
                </div>
                <div class="text-right text-xs space-y-1 mt-2 sm:mt-0">
                    <div class="text-sky-300 font-medium">외기온도: ${Math.round(drive.outside_temp)}°C</div>
                    <div class="text-slate-400 text-[11px]">소모 전력: ${drive.energy_used} kWh</div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // 4, 5, 6번: 최근 상태 히스토리 (외기온도, 클릭 시 주행지도 단일/일간 연결)
    function renderStatusHistoryList() {
        const container = document.getElementById('status-history-container');
        if(!container) return;
        container.innerHTML = '';

        const grouped = {};
        STATE.drives.forEach(d => {
            if(!grouped[d.date_str]) grouped[d.date_str] = [];
            grouped[d.date_str].push(d);
        });

        Object.keys(grouped).forEach(dateStr => {
            const dayGroup = document.createElement('div');
            dayGroup.className = 'glass-panel p-4 space-y-3';

            // 6번: 날짜 누르면 일간 주행 날짜로 연결
            dayGroup.innerHTML = `
                <div class="flex justify-between items-center border-b border-slate-700 pb-2 cursor-pointer hover:text-sky-400" onclick="selectAndNavigateToDate('${dateStr}')">
                    <h4 class="font-bold text-sm text-sky-400 flex items-center gap-2">
                        <i class="fa-regular fa-calendar-check"></i> ${dateStr} (일간 기록 보기)
                    </h4>
                    <span class="text-xs text-slate-400">일간 주행지도로 이동 ➔</span>
                </div>
                <div class="space-y-2" id="group-items-${dateStr}"></div>
            `;

            container.appendChild(dayGroup);
            const itemsContainer = dayGroup.querySelector(`#group-items-${dateStr}`);

            grouped[dateStr].forEach(drive => {
                // 5번: 각각의 주행 선택시 단일 운행으로 연결
                const item = document.createElement('div');
                item.className = 'bg-slate-800/60 p-2.5 rounded border border-slate-700/60 flex justify-between items-center clickable-card';
                item.onclick = (e) => {
                    e.stopPropagation();
                    selectAndNavigateToDrive(drive.id, 'single');
                };

                // 4번: 외기 온도 표시
                item.innerHTML = `
                    <div>
                        <div class="text-xs font-semibold text-white">${drive.start_time_str} - ${drive.end_time_str} (${drive.start_dong} ➔ ${drive.end_dong})</div>
                        <div class="text-[11px] text-slate-400">거리: ${drive.distance_km} km | 전비: ${drive.efficiency} Wh/km</div>
                    </div>
                    <div class="text-xs font-bold text-sky-400 bg-sky-500/10 px-2 py-1 rounded border border-sky-500/20">
                        외기: ${Math.round(drive.outside_temp)}°C
                    </div>
                `;
                itemsContainer.appendChild(item);
            });
        });
    }

    // 11번: 최근 50개 배터리/외기온도 시각화
    function renderBatteryChart() {
        const ctx = document.getElementById('batteryChart')?.getContext('2d');
        if(!ctx) return;
        if(STATE.chartInstance) STATE.chartInstance.destroy();

        const slicedVeh = STATE.vehicles.slice(0, 50).reverse();
        const labels = slicedVeh.map((v, i) => v.time_str || `#${i+1}`);
        const batData = slicedVeh.map(v => v.battery_level);
        const tempData = slicedVeh.map(v => Math.round(v.outside_temp));

        STATE.chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    { label: '배터리 (%)', data: batData, borderColor: '#34d399', backgroundColor: 'rgba(52, 211, 153, 0.1)', yAxisID: 'yBat', fill: true },
                    { label: '외기 온도 (°C)', data: tempData, borderColor: '#38bdf8', yAxisID: 'yTemp', borderDash: [5, 5] }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    // 7, 8, 9, 10번: 주행지도 세부정보 패널 (시간, 외기온도 추가정보 및 sublist 연결)
    function renderMapAndPanel() {
        const panelTitle = document.getElementById('detail-panel-title');
        const panelContent = document.getElementById('detail-panel-content');
        const sublistItems = document.getElementById('sublist-items');
        if(!panelTitle || !panelContent) return;

        const drive = STATE.drives.find(d => d.id === STATE.selectedDriveId) || STATE.drives[0];

        if (STATE.filterMode === 'single') {
            panelTitle.innerText = '단일 운행 상세 기록';
            panelContent.innerHTML = `
                <div class="bg-slate-800/80 p-3 rounded-lg border border-slate-700 space-y-2">
                    <div class="flex justify-between border-b border-slate-700 pb-1.5">
                        <span class="text-slate-400">구간:</span>
                        <span class="font-bold text-white">${drive.start_dong} ➔ ${drive.end_dong}</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-slate-400">시간:</span>
                        <span class="text-sky-300 font-semibold">${drive.start_time_str} ~ ${drive.end_time_str}</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-slate-400">외기 온도:</span>
                        <span class="text-amber-400 font-bold">${Math.round(drive.outside_temp)} °C</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-slate-400">주행거리 / 소모량:</span>
                        <span class="text-emerald-400 font-bold">${drive.distance_km} km / ${drive.energy_used} kWh</span>
                    </div>
                </div>
            `;
            if(sublistItems) sublistItems.innerHTML = `<div class="text-slate-500 text-xs">단일 운행 선택 상태입니다.</div>`;
        } else {
            panelTitle.innerText = `${STATE.filterMode.toUpperCase()} 통합 정보`;
            panelContent.innerHTML = `
                <div class="bg-slate-800/80 p-3 rounded-lg border border-slate-700 space-y-2">
                    <div class="flex justify-between"><span class="text-slate-400">총 운행:</span><span class="font-bold text-white">${STATE.drives.length} 회</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">총 거리:</span><span class="text-sky-300 font-bold">71.7 km</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">평균 외기온도:</span><span class="text-amber-400 font-bold">26 °C</span></div>
                </div>
            `;
            // 9번: 아래쪽 목록 클릭 시 해당 단일 운행 이동
            if(sublistItems) {
                sublistItems.innerHTML = '';
                STATE.drives.forEach(d => {
                    const item = document.createElement('div');
                    item.className = 'p-2 bg-slate-900 hover:bg-slate-800 rounded border border-slate-800 text-xs flex justify-between cursor-pointer';
                    item.onclick = () => selectAndNavigateToDrive(d.id, 'single');
                    item.innerHTML = `
                        <span class="text-slate-300">${d.start_time_str} (${d.start_dong}➔${d.end_dong})</span>
                        <span class="text-sky-400 font-semibold">${d.distance_km}km | ${Math.round(d.outside_temp)}°C</span>
                    `;
                    sublistItems.appendChild(item);
                });
            }
        }
    }

    // Navigation Linking Functions
    function selectAndNavigateToDrive(driveId, mode = 'single') {
        STATE.selectedDriveId = driveId;
        switchTab('map');
        setMapFilterMode(mode);
        appendLog(`단일 주행 (#${driveId}) 지도로 이동`);
    }

    function selectAndNavigateToDate(dateStr) {
        switchTab('map');
        setMapFilterMode('daily');
        appendLog(`날짜 [${dateStr}] 일간 주행 지도로 이동`);
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('text-sky-400', 'bg-sky-500/10', 'border'));
        document.getElementById(`tab-btn-${tabName}`)?.classList.add('text-sky-400', 'bg-sky-500/10', 'border');

        ['map', 'history', 'status-history', 'battery', 'guardian'].forEach(t => {
            document.getElementById(`tab-content-${t}`)?.classList.add('hidden');
        });
        document.getElementById(`tab-content-${tabName}`)?.classList.remove('hidden');
    }

    function setMapFilterMode(mode) {
        STATE.filterMode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('bg-slate-700', 'text-white'));
        document.getElementById(`mode-btn-${mode}`)?.classList.add('bg-slate-700', 'text-white');
        renderMapAndPanel();
    }

    // Mock Data Helpers
    function getMockDriveData() {
        return [
            { id: 101, date_str: '2026-07-28', start_time_str: '08:30', end_time_str: '09:15', start_dong: '서울 강남구', end_dong: '경기 성남시', distance_km: 18.4, outside_temp: 24.2, energy_used: 3.1, efficiency: 168 },
            { id: 102, date_str: '2026-07-28', start_time_str: '18:20', end_time_str: '19:10', start_dong: '경기 성남시', end_dong: '서울 서초구', distance_km: 19.1, outside_temp: 26.8, energy_used: 3.3, efficiency: 172 },
            { id: 103, date_str: '2026-07-27', start_time_str: '11:00', end_time_str: '12:05', start_dong: '서울 서초구', end_dong: '인천 연수구', distance_km: 34.2, outside_temp: 28.1, energy_used: 5.8, efficiency: 169 }
        ];
    }

    function getMockVehicleData() {
        const list = [];
        for(let i=0; i<50; i++) {
            list.push({
                time_str: `07-28 ${23-Math.floor(i/2)}:${(i%2)*30}`,
                outside_temp: 22 + Math.sin(i) * 4,
                battery_level: Math.max(20, 90 - i),
                tpms_front_left: 41.2, tpms_front_right: 41.5,
                tpms_rear_left: 40.8, tpms_rear_right: 40.9, tpms_temp: 25.4
            });
        }
        return list;
    }

    // 12, 13번: 감시 가디언 및 로그 연동
    function handleTeslaLogin(e) {
        e.preventDefault();
        appendLog(`Tesla 계정 로그인 및 OAuth 토큰 요청 중...`);
        setTimeout(() => {
            document.getElementById('active-token-display').innerText = `eyJhbGciOiJSUzI1NiI...[AUTH_${Date.now()}]`;
            appendLog('Tesla 계정 인증 완료!');
        }, 600);
    }

    function toggleSentryMode() {
        const btn = document.getElementById('sentry-toggle-btn');
        if(btn.innerText.includes('ACTIVE')) {
            btn.innerText = 'DISABLED';
            btn.className = 'bg-slate-700 text-slate-400 border border-slate-600 px-3 py-1.5 rounded font-bold';
            appendLog('Sentry Mode 비활성화 완료.');
        } else {
            btn.innerText = 'ACTIVE';
            btn.className = 'bg-red-500/20 text-red-400 border border-red-500/40 px-3 py-1.5 rounded font-bold';
            appendLog('Sentry Mode 원격 활성화 완료.');
        }
    }

    function clearDebugLogs() { document.getElementById('debug-log-console').innerHTML = ''; }
    function openSettingsModal() { document.getElementById('settings-modal').classList.remove('hidden'); }
    function closeSettingsModal() { document.getElementById('settings-modal').classList.add('hidden'); }
    function saveSettingsModal() { closeSettingsModal(); appendLog('설정 적용 완료.'); }

    function initTeslaDashApp() {
        appendLog('Tesla Dash App 초기화 시작...');
        fetchSupabaseData();
    }
</script>
