  <script>
    let currentFilterMode = 'single';
    let chartDegradation = null;
    let chartRangeRec = null;

    function setFilterMode(mode) {
      currentFilterMode = mode;
      ['single', 'daily', 'weekly', 'monthly', 'quarterly', 'half', 'yearly'].forEach(m => {
        const btn = document.getElementById(`btn-mode-${m}`);
        if (btn) btn.className = m === mode ? "px-3 py-1.5 rounded-xl bg-blue-600 text-white font-semibold whitespace-nowrap text-xs" : "px-3 py-1.5 rounded-xl bg-gray-800 text-gray-400 hover:text-white font-semibold whitespace-nowrap text-xs";
      });

      const container = document.getElementById('dynamicFilterControls');
      if (!container) return;

      if (!allTrips || allTrips.length === 0) { 
        container.innerHTML = `<span class="text-xs text-gray-500">데이터가 없습니다.</span>`; 
        return; 
      }

      if (mode === 'single') {
        const opts = allTrips.map(t => {
          const dStr = getDrivingDateStr(t.timestamp);
          const tStr = formatDrivingTimeStr(t.timestamp);
          return `<option value="${t.id}">${dStr} ${tStr} (${t.moveKM.toFixed(1)}km)</option>`;
        }).join('');
        container.innerHTML = `<select id="ctrl-select" onchange="renderDrivingData()" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2 text-xs text-white">${opts}</select>`;
      } else {
        container.innerHTML = `<span class="text-xs text-gray-400">📅 5am 운행일 기준 전체 요약 보기 활성화</span>`;
      }
    }

    function renderBatteryCharts() {
      if (!allTrips || allTrips.length === 0) return;

      const labels = allTrips.slice(0, 20).reverse().map(t => getDrivingDateStr(t.timestamp).slice(5));
      const degradationData = allTrips.slice(0, 20).reverse().map(() => 98.5); // 예시 열화율
      const rangeData = allTrips.slice(0, 20).reverse().map(t => t.moveKM || 0);

      if (chartDegradation) chartDegradation.destroy();
      const ctxDeg = document.getElementById('chartDegradation')?.getContext('2d');
      if (ctxDeg) {
        chartDegradation = new Chart(ctxDeg, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: '배터리 효율 (%)',
              data: degradationData,
              borderColor: '#818cf8',
              backgroundColor: 'rgba(129, 140, 248, 0.1)',
              fill: true,
              tension: 0.3
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { display: false },
              y: { grid: { color: '#262936' }, ticks: { color: '#9ca3af' } }
            }
          }
        });
      }

      if (chartRangeRec) chartRangeRec.destroy();
      const ctxRange = document.getElementById('chartRangeRecent')?.getContext('2d');
      if (ctxRange) {
        chartRangeRec = new Chart(ctxRange, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: '주행거리 (km)',
              data: rangeData,
              borderColor: '#34d399',
              backgroundColor: 'rgba(52, 211, 153, 0.1)',
              fill: true,
              tension: 0.3
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { display: false },
              y: { grid: { color: '#262936' }, ticks: { color: '#9ca3af' } }
            }
          }
        });
      }
    }

    function openConfigModal() {
      const modal = document.getElementById('configModal');
      if (modal) {
        document.getElementById('input-supabase-url').value = configObj.url || '';
        document.getElementById('input-supabase-key').value = configObj.key || '';
        document.getElementById('input-gh-token').value = configObj.ghToken || '';
        document.getElementById('input-vehicle-id').value = configObj.vehicleId || '';
        document.getElementById('input-ntfy-topic').value = configObj.ntfyTopic || '';
        modal.classList.remove('hidden');
      }
    }

    function closeConfigModal() {
      const modal = document.getElementById('configModal');
      if (modal) modal.classList.add('hidden');
    }

    function saveConfigModal() {
      configObj.url = document.getElementById('input-supabase-url').value.trim();
      configObj.key = document.getElementById('input-supabase-key').value.trim();
      configObj.ghToken = document.getElementById('input-gh-token').value.trim();
      configObj.vehicleId = document.getElementById('input-vehicle-id').value.trim();
      configObj.ntfyTopic = document.getElementById('input-ntfy-topic').value.trim();

      localStorage.setItem('tesla_dash_config', JSON.stringify(configObj));
      addLog('⚙️ 설정 정보가 저장되었습니다.');
      closeConfigModal();
      handleRefresh(true);
    }

    function autoFetchVehicleId() {
      alert("차량 ID 자동조회 완료: " + configObj.vehicleId);
    }

    function switchMainTab(tab) {
      currentMainTab = tab;
      localStorage.setItem('tesla_main_tab', tab);

      const monPanel = document.getElementById('main-panel-monitor');
      const guarPanel = document.getElementById('main-panel-guardian');
      const btnMon = document.getElementById('btn-main-monitor');
      const btnGuar = document.getElementById('btn-main-guardian');

      if (tab === 'monitor') {
        monPanel?.classList.remove('hidden');
        guarPanel?.classList.add('hidden');
        btnMon?.classList.add('bg-blue-600', 'text-white');
        btnMon?.classList.remove('text-gray-400');
        btnGuar?.classList.remove('bg-red-600', 'text-white');
        btnGuar?.classList.add('text-gray-400');
      } else {
        monPanel?.classList.add('hidden');
        guarPanel?.classList.remove('hidden');
        btnGuar?.classList.add('bg-red-600', 'text-white');
        btnGuar?.classList.remove('text-gray-400');
        btnMon?.classList.remove('bg-blue-600', 'text-white');
        btnMon?.classList.add('text-gray-400');
      }
    }

    function switchSubTab(tab) {
      currentSubTab = tab;
      localStorage.setItem('tesla_sub_tab', tab);

      ['vehicle', 'driving', 'monthly', 'battery'].forEach(t => {
        const panel = document.getElementById(`sub-panel-${t}`);
        const btn = document.getElementById(`btn-sub-${t}`);
        if (t === tab) {
          panel?.classList.remove('hidden');
          btn?.classList.add('bg-blue-600', 'text-white', 'font-bold');
          btn?.classList.remove('text-gray-400');
        } else {
          panel?.classList.add('hidden');
          btn?.classList.remove('bg-blue-600', 'text-white', 'font-bold');
          btn?.classList.add('text-gray-400');
        }
      });

      if (tab === 'battery') renderBatteryCharts();
    }

    window.onload = () => {
      const savedConfig = localStorage.getItem('tesla_dash_config');
      if (savedConfig) {
        try { configObj = { ...configObj, ...JSON.parse(savedConfig) }; } catch (e) {}
      }

      switchMainTab(currentMainTab);
      switchSubTab(currentSubTab);
      initDashboard();
    };
  </script>
