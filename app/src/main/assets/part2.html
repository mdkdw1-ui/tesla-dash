<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex-1 w-full space-y-6 pb-6">
    <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="glass-panel p-4 flex flex-col justify-between">
            <div class="flex justify-between items-center text-slate-400 text-xs font-semibold">
                <span>외기 온도 / 상태</span>
                <i class="fa-solid fa-temperature-half text-sky-400"></i>
            </div>
            <div class="mt-2 flex items-baseline space-x-2">
                <span id="summary-outside-temp" class="text-3xl font-extrabold text-white">--</span>
                <span class="text-sm text-slate-400">°C</span>
            </div>
            <div id="summary-vehicle-state" class="text-xs text-emerald-400 mt-1 flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Online
            </div>
        </div>

        <div class="glass-panel p-4 flex flex-col justify-between">
            <div class="flex justify-between items-center text-slate-400 text-xs font-semibold">
                <span>배터리 잔량</span>
                <i class="fa-solid fa-battery-three-quarters text-emerald-400"></i>
            </div>
            <div class="mt-2 flex items-baseline space-x-2">
                <span id="summary-battery-level" class="text-3xl font-extrabold text-white">--</span>
                <span class="text-sm text-slate-400">%</span>
            </div>
            <div class="w-full bg-slate-700 h-1.5 rounded-full mt-2 overflow-hidden">
                <div id="summary-battery-bar" class="bg-emerald-400 h-full w-0 transition-all duration-500"></div>
            </div>
        </div>

        <div class="glass-panel p-4 flex flex-col justify-between">
            <div class="flex justify-between items-center text-slate-400 text-xs font-semibold">
                <span>타이어 공기압 (PSI)</span>
                <i class="fa-solid fa-gauge-high text-amber-400"></i>
            </div>
            <div class="mt-2 grid grid-cols-2 gap-2 text-xs">
                <div class="bg-slate-800/80 p-1.5 rounded border border-slate-700/50 flex justify-between">
                    <span class="text-slate-400">전좌/우:</span>
                    <span id="tpms-front" class="font-bold text-slate-200">-- / --</span>
                </div>
                <div class="bg-slate-800/80 p-1.5 rounded border border-slate-700/50 flex justify-between">
                    <span class="text-slate-400">후좌/우:</span>
                    <span id="tpms-rear" class="font-bold text-slate-200">-- / --</span>
                </div>
            </div>
            <div class="text-[11px] text-slate-400 mt-1 text-right">
                내부/타이어 온도: <span id="tpms-temp-rounded" class="text-slate-200 font-semibold">--°C</span>
            </div>
        </div>

        <div class="glass-panel p-4 flex flex-col justify-between">
            <div class="flex justify-between items-center text-slate-400 text-xs font-semibold">
                <span>최근 주행 요약</span>
                <i class="fa-solid fa-route text-indigo-400"></i>
            </div>
            <div class="mt-2">
                <div id="summary-last-drive-dist" class="text-2xl font-bold text-white">0.0 km</div>
                <div id="summary-last-drive-time" class="text-xs text-slate-400 truncate">--:-- ~ --:--</div>
            </div>
            <div id="summary-last-drive-temp" class="text-xs text-sky-400 mt-1">외기온도: --°C</div>
        </div>
    </section>

    <div class="flex space-x-2 border-b border-slate-700/60 pb-2 overflow-x-auto">
        <button onclick="switchTab('map')" id="tab-btn-map" class="tab-btn active px-4 py-2 rounded-lg font-medium text-sm text-sky-400 bg-sky-500/10 border border-sky-500/30">주행 지도</button>
        <button onclick="switchTab('history')" id="tab-btn-history" class="tab-btn px-4 py-2 rounded-lg font-medium text-sm text-slate-400 hover:bg-slate-800">최근 운행 기록</button>
        <button onclick="switchTab('status-history')" id="tab-btn-status-history" class="tab-btn px-4 py-2 rounded-lg font-medium text-sm text-slate-400 hover:bg-slate-800">최근 상태 히스토리</button>
        <button onclick="switchTab('battery')" id="tab-btn-battery" class="tab-btn px-4 py-2 rounded-lg font-medium text-sm text-slate-400 hover:bg-slate-800">배터리/외기온도 (50개)</button>
        <button onclick="switchTab('guardian')" id="tab-btn-guardian" class="tab-btn px-4 py-2 rounded-lg font-medium text-sm text-slate-400 hover:bg-slate-800">감시 가디언</button>
    </div>
</main>
